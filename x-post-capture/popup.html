<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Post Capture</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #e7e9ea;
        background: #000;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid #2f3336;
      }

      header h1 {
        font-size: 14px;
        font-weight: 700;
      }

      header .badge {
        margin-left: auto;
        background: #1d9bf0;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 10px;
        min-width: 20px;
        text-align: center;
      }

      #empty {
        padding: 24px 14px;
        color: #71767b;
        text-align: center;
        line-height: 1.6;
      }

      #list {
        max-height: 360px;
        overflow-y: auto;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #2f3336;
        transition: background 0.1s;
      }

      .item:hover {
        background: #111;
      }

      .item-info {
        flex: 1;
        overflow: hidden;
      }

      .item-filename {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-time {
        color: #71767b;
        font-size: 11px;
        margin-top: 2px;
      }

      .btn-dl {
        flex-shrink: 0;
        background: #1d9bf0;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.1s;
      }

      .btn-dl:hover {
        background: #1a8cd8;
      }

      footer {
        padding: 8px 14px;
        border-top: 1px solid #2f3336;
        color: #71767b;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>X Post Capture</h1>
      <span class="badge" id="badge">0</span>
    </header>

    <div id="empty">
      ツイートの個別ページを開くと<br />
      自動でキャプチャされます
    </div>

    <div id="list" hidden></div>

    <footer>個別ページを開くと自動キャプチャ・ボタン押下で保存</footer>

    <script src="popup.js"></script>
  </body>
</html>
